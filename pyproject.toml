[project]
name = "eqr"
version = "0.1.0"
description = "Sumaer Research Bot: point-in-time Indian equity research engine with Claude dossiers"
requires-python = ">=3.13"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "numpy>=2.0",
  "scipy>=1.14",
  "requests>=2.32",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13",
  "jsonschema>=4.23",
  "pypdf>=5.0",
  "yfinance>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[project.scripts]
eqr = "eqr.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eqr*"]

[tool.setuptools.package-data]
eqr = ["store/schema.sql", "store/migrations.sql", "research/schema.json", "surfaces/web/templates/*.html", "surfaces/web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
